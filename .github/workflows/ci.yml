name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go test ./internal/... ./pkg/... -count=1
        run: go test ./internal/... ./pkg/... -count=1

      # COMPILE the integration suite even though CI has no Postgres to run it
      # against. It had silently rotted out of compiling against SetupRoutes —
      # six parameters behind — and because nothing here ever referenced
      # ./tests/..., the whole suite was dead with no signal. Building it is
      # cheap and catches exactly that class of drift on the commit that causes
      # it rather than months later.
      - name: go vet -tags=integration ./tests/...
        run: go vet -tags=integration ./tests/...
