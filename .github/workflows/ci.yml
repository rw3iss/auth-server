name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, production]

jobs:
  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: go build ./...
        run: go build ./...

      - name: go test ./internal/... -count=1
        run: go test ./internal/... -count=1
