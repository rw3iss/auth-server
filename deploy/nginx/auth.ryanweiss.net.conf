# /opt/ven-cms/nginx/conf.d/auth.ryanweiss.net.conf
#
# Reverse-proxy auth.ryanweiss.net -> systemd auth-server on host :8090.
# nginx itself runs as the ven-nginx container; the host port is reached
# via the docker bridge gateway (host.docker.internal on Linux requires
# `extra_hosts: ["host.docker.internal:host-gateway"]` on the nginx
# service, which ven-nginx already has).
#
# SSL: cert issued via certbot --webroot -w /var/www/certbot for
# auth.ryanweiss.net; we copy fullchain+privkey into
# /opt/ven-cms/nginx/ssl/new-auth-{fullchain,privkey}.pem (mounted into
# the container at /etc/nginx/ssl/).

# -- ACME + 80->443 redirect ---------------------------------------------------
server {
    listen 80;
    server_name auth.ryanweiss.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -- 443 reverse proxy ---------------------------------------------------------
server {
    listen 443 ssl;
    server_name auth.ryanweiss.net;

    ssl_certificate     /etc/nginx/ssl/new-auth-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/new-auth-privkey.pem;

    # Reasonable defaults; tighten later if needed.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Docker DNS so the resolver re-evaluates host.docker.internal -> bridge
    # gateway IP on each request (handles bridge IP changes after host reboot).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cap request body to keep bots from filling memory on a public surface.
    client_max_body_size 1M;

    # Auth-server takes ~milliseconds; bound the upstream wait so a hung
    # backend doesn't park nginx workers indefinitely.
    proxy_connect_timeout 3s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;

    # RESPONSE HEADER BUFFERS. Required, not tuning — and the failure it prevents is one of the most
    # misleading this stack can produce.
    #
    # A `cookie_mode` login answers with three Set-Cookie headers, one carrying a ~2.9KB access JWT. That
    # pushes the response headers past nginx's DEFAULT 4KB proxy_buffer_size, so nginx DISCARDS a
    # perfectly good upstream 200 and synthesises a 502 of its own. Because the 502 is nginx's, it carries
    # none of the CORS headers the upstream set — so a browser reports:
    #
    #   "blocked by CORS policy: No 'Access-Control-Allow-Origin' header is present"
    #
    # …which sends you hunting a CORS misconfiguration that does not exist, while the auth service logs
    # status=200 for the very same request. Found exactly that way, on production, after enabling
    # cookie_mode; the giveaway is `upstream sent too big header` in nginx's error.log.
    #
    # It is also SIZE-DEPENDENT, which makes it look intermittent: an account with fewer roles produces a
    # smaller JWT and slips under the limit, so it fails for some users and not others.
    proxy_buffer_size       16k;
    proxy_buffers        8  16k;
    proxy_busy_buffers_size 32k;

    location / {
        set $upstream "http://host.docker.internal:8090";
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
